[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-rag"
version = "0.1.2"
description = "Video RAG — a Python library for retrieval-augmented generation over video"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pymediainfo",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_rag*"]